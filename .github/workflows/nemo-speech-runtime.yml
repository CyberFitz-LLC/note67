# Build the NeMo-Speech.cpp runtime that the local recogniser backend spawns.
#
# Not part of the app build and not bundled: the installer stays ~20 MB and the
# runtime is fetched separately, like a Whisper model. This exists because
# NVIDIA's v0.1.0 release predates Nemotron-3 Diarization (upstream #50, made
# the default in #52), and upstream CI builds Windows binaries on every main
# push without publishing them. So we build the exact commit ourselves.
#
# Mirrors upstream's own windows-vulkan job (.github/workflows/gpu.yml) rather
# than inventing a build: same script, same profile, same prerequisites.
name: nemo-speech runtime

on:
  push:
    branches: [build/nemo-speech-v3]
    paths: [.github/workflows/nemo-speech-runtime.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: NeMo-Speech.cpp commit to build
        default: 97a15afa5caa9bce5baaa86c1184103877af4101

env:
  # 97a15af = "make Nemotron 3 Diarization the default diarizer" (#52).
  NEMO_SPEECH_REF: ${{ inputs.ref || '97a15afa5caa9bce5baaa86c1184103877af4101' }}

jobs:
  windows-vulkan:
    # Vulkan, not CUDA: one binary drives the NVIDIA, Intel and AMD GPUs across
    # the fleet, needs no CUDA runtime DLLs, and matches how Note67 itself ships.
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Checkout NeMo-Speech.cpp at the pinned commit
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/NeMo-Speech.cpp
          ref: ${{ env.NEMO_SPEECH_REF }}
          persist-credentials: false

      - name: Initialize submodules
        run: git submodule update --init --depth 1 ggml llama.cpp

      - name: Install build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @('vulkan-sdk')
          foreach ($tool in @{ cmake = 'cmake'; ninja = 'ninja'; python = 'python' }.GetEnumerator()) {
            if (-not (Get-Command $tool.Key -ErrorAction SilentlyContinue)) { $packages += $tool.Value }
          }
          choco install -y --no-progress @packages
          # Deliberately NOT republishing the machine/user PATH to GITHUB_PATH,
          # though upstream's job does. build.ps1 already prepends machine+user
          # to the process PATH, so republishing carries three copies. On a
          # GitHub-hosted runner, whose PATH is long to begin with, that passes
          # cmd.exe's 8191-character limit, vcvars64.bat fails with its output
          # discarded, and the build dies on "cl not on PATH".
          $vulkan = [Environment]::GetEnvironmentVariable('VULKAN_SDK', 'Machine')
          if ($vulkan) { Add-Content -Path $env:GITHUB_ENV -Value "VULKAN_SDK=$vulkan" }

      - name: Configure and build
        shell: pwsh
        run: |
          $m = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $u = [Environment]::GetEnvironmentVariable('Path', 'User')
          Write-Host "PATH length the build will see: $(("$m;$u;$env:Path").Length) (cmd.exe limit 8191)"
          scripts\windows\build.ps1 -Backend vulkan -Profile core `
            -BuildDir "${{ github.workspace }}\build\windows-vulkan"

      - name: Package bin and share
        # The binary finds its model index at <exe>\..\share\nemo-speech\
        # model-index.json. The first artifact shipped bin\ alone and could not
        # resolve a single model by name, because the check below ran inside
        # the source checkout where the index happens to sit. So the package is
        # assembled separately, and checked from somewhere the source is not.
        shell: pwsh
        run: |
          $pkg = Join-Path $env:RUNNER_TEMP 'nemo-speech'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item -Recurse build\windows-vulkan\bin (Join-Path $pkg 'bin')
          Copy-Item -Recurse build\windows-vulkan\share (Join-Path $pkg 'share')
          Get-ChildItem -Recurse $pkg | Select-Object -ExpandProperty FullName
          Add-Content -Path $env:GITHUB_ENV -Value "NEMO_SPEECH_PKG=$pkg"

      - name: Prove the packaged binary knows the V3 diarizer
        # A binary that cannot name the new model would silently fall back to
        # Sortformer V2 — the thing this build exists to replace. Run from the
        # package, with cwd outside the checkout, so a missing file fails here.
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $exe = Join-Path $env:NEMO_SPEECH_PKG 'bin\nemo-speech.exe'
          & $exe --version
          $list = & $exe model list | Out-String
          $list
          if ($list -notmatch 'Nemotron-3-Diarization') { throw 'packaged model index does not list Nemotron-3-Diarization' }

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: nemo-speech-windows-vulkan-${{ env.NEMO_SPEECH_REF }}
          path: ${{ env.NEMO_SPEECH_PKG }}
          retention-days: 30
