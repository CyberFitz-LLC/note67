[package]
name = "note67"
version = "0.1.31"
description = "A private, local notes assistant"
authors = ["you"]
license = "AGPL-3.0-or-later"
edition = "2024"

[lib]
name = "note67_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# GPU backends for Whisper. Off by default so a plain `cargo build` stays
# CPU-only and needs no SDK; CI builds one artifact per backend.
#
# Vulkan is the portable choice: one binary drives NVIDIA, AMD and Intel GPUs
# and falls back to CPU when no device is present. CUDA is faster on NVIDIA but
# produces an NVIDIA-only binary that must ship the CUDA runtime DLLs.
#
# Mutually exclusive in practice — pick one per build.
# The workspace root stays here rather than at the repo root so cargo keeps
# building into src-tauri/target — the CI verification steps and the local build
# script both look there.
[workspace]
members = ["crates/note67-canonical"]

[features]
default = []
gpu-vulkan = ["whisper-rs/vulkan"]
gpu-cuda = ["whisper-rs/cuda"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", features = ["mp3", "aac", "alac", "flac", "ogg", "wav", "isomp4", "mkv"] }
ringbuf = "0.4"
whisper-rs = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "macros"] }
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures-util = "0.3"

# Streaming ASR. rustls rather than native-tls to match reqwest and avoid a
# second TLS stack in the bundle; `connect` brings the client half only.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"] }
scopeguard = "1.2"
regex = "1"

# ExoChain. Native crates rather than the WASM adapter (DECISIONS.md D1):
# exochain is Apache-2.0, which is a permitted direction into AGPL-3.0, and
# exo-avc already exposes in Rust what the wasm bindings wrap for TypeScript
# callers. Pinned exactly so the enforcement surface cannot move underneath us.
# exochain-core 0.2.3 does not currently build (ml-dsa pins a pre-release
# pkcs8), so the DID derivation is implemented against its specification and
# guarded by a known-answer test. Swap to the crates once upstream is fixed;
# the DIDs must not change. See src/exochain/identity.rs and DECISIONS.md D1.
# Formats the sync service must reproduce byte for byte live in their own
# crate, so there is one definition rather than two implementations of a
# written spec. See docs/sync/DESIGN.md section 2.
note67-canonical = { path = "crates/note67-canonical" }
ed25519-dalek = "2"
getrandom = "0.2"
hex = "0.4"
sha2 = "0.10"

# EXOCHAIN, for emitting meeting receipts.
#
# Pinned to the v0.3.1 release tag commit (3d0941be), which is what the
# production node reports from /health. v0.3.1 enforces action names against
# the credential's objectives and jurisdictions, and returns 200 with a signed
# Deny receipt for a refusal; src/exochain/emit.rs handles both. A credential
# minted by the App Registry deserializes into these types and its payload
# builds, which is verified by test rather than assumed.
#
# The packages are published as exochain-* (their source dirs are exo-*),
# hence the `package` keys.
exochain-avc = { package = "exochain-avc", git = "https://github.com/exochain/exochain.git", rev = "3d0941beee2a60e3f226da2b35f9b958ba37112f" }
exochain-core = { package = "exochain-core", git = "https://github.com/exochain/exochain.git", rev = "3d0941beee2a60e3f226da2b35f9b958ba37112f" }
exochain-authority = { package = "exochain-authority", git = "https://github.com/exochain/exochain.git", rev = "3d0941beee2a60e3f226da2b35f9b958ba37112f" }

# The pkcs8/spki pre-release pins this used to carry are gone: from v0.3.1,
# ml-dsa 0.1.0-rc.7 no longer depends on pkcs8 at all (checked against
# exochain's own Cargo.lock and `cargo tree -i`), so nothing pulled them in but
# the pins themselves.

# macOS-specific dependencies for system audio capture via ScreenCaptureKit
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSError", "NSString", "NSArray", "NSDictionary", "NSNotification", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "CMTime"] }
objc2-core-audio-types = "0.3"
block2 = "0.6"
dispatch = "0.2"
core-graphics = "0.24"
core-foundation = "0.10"

# Windows-specific dependencies for system audio capture via WASAPI loopback
[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.16"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
